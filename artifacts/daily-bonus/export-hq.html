<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Бонус — экспорт PNG</title>
<body style="margin:0;background:#eee">
<p id="status">Подготовка PNG…</p>
<script type="module">
import styles from '/src/daily-bonus-welcome.css?raw';
import noticeStyles from '/src/daily-bonus-notice.css?raw';
import glow from '/src/assets/welcome/daily-bonus-glow.png?url';
const cardType = new URLSearchParams(location.search).get('card');
const isExhausted = cardType === 'exhausted';
const isLargeExhausted = cardType === 'exhausted-large';
const isNotice = cardType === 'notice' || isExhausted;
const width = isNotice ? 294 : 520;
const scale = isNotice ? 4 : 3;
const dataUrl = async (url) => {
  const blob = await (await fetch(url)).blob();
  return new Promise(resolve => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.readAsDataURL(blob); });
};
let fonts = '';
for (const weight of [400, 500, 600, 700]) {
  for (const subset of ['latin', 'cyrillic']) {
    const url = await dataUrl(`/node_modules/@fontsource/inter/files/inter-${subset}-${weight}-normal.woff2`);
    const range = subset === 'cyrillic' ? 'U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116' : 'U+0000-00FF,U+2000-206F,U+20AC,U+20BD';
    fonts += `@font-face{font-family:Inter;font-style:normal;font-weight:${weight};src:url("${url}") format("woff2");unicode-range:${range};}`;
  }
}
const artwork = await dataUrl(glow);
const css = `${fonts}${styles}${noticeStyles}
*{box-sizing:border-box}
.daily-bonus-welcome{position:relative;display:block;width:520px;max-height:none;margin:0;box-shadow:none;overflow:hidden}
.daily-bonus-glow,.daily-bonus-exhausted .daily-bonus-glow{animation:none;transform:none}
button{font-family:inherit}
.daily-bonus-notice{position:relative;width:294px;box-shadow:none;animation:none;font-family:Inter,Arial,sans-serif}
.daily-bonus-notice-art img{animation:none}
.daily-bonus-notice-exhausted{padding:22px 18px 18px}
.daily-bonus-notice-exhausted h2{margin-bottom:11px}
.daily-bonus-notice-exhausted .daily-bonus-notice-action{margin-top:18px;min-height:32px}
`;
const card = isNotice ? `<div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>
<aside class="daily-bonus-notice${isExhausted ? ' daily-bonus-notice-exhausted' : ''}">
<div class="daily-bonus-notice-art"><img src="${artwork}" /></div>
<button class="daily-bonus-notice-close"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
<div class="daily-bonus-notice-body">
${isExhausted ? `
<div class="daily-bonus-notice-copy"><h2>Пробный период закончился</h2><p>Пополните баланс, чтобы продолжить<br />анализ звонков и тренировки.</p></div>
<button class="daily-bonus-notice-action">Пополнить баланс</button>
` : `
<div class="daily-bonus-notice-copy"><h2>Дневной бонус обновлён</h2><p>Сегодня доступно <strong>250 ₽</strong><br />на анализ звонков и тренировки.</p></div>
<p class="daily-bonus-notice-next">Следующее обновление лимитов — в <strong>00:00</strong></p>
<p class="daily-bonus-notice-remaining">Осталось обновлений: <strong>9 из 10</strong></p>
<button class="daily-bonus-notice-action">Приступить</button>
`}
</div></aside></div>` : `<div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>
<div class="daily-bonus-welcome${isLargeExhausted ? ' daily-bonus-exhausted' : ''}">
<div class="daily-bonus-art"><img class="daily-bonus-glow" src="${artwork}" /></div>
<button class="daily-bonus-close"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
${isLargeExhausted ? `<div class="daily-bonus-content daily-bonus-exhausted-content">
<h1>Пробный период<span class="daily-bonus-heading">закончился</span></h1>
<p id="daily-bonus-description">Пополните баланс, чтобы продолжить<br />анализ звонков и тренировки.</p>
<button class="daily-bonus-start">Пополнить баланс</button>
</div>` : `<div class="daily-bonus-content">
<h1><span class="daily-bonus-amount">250 <span class="daily-bonus-currency">₽</span></span><span class="daily-bonus-heading">бонусами каждый день</span></h1>
<p class="daily-bonus-intro">Попробуйте IQ MENTOR</p>
<p id="daily-bonus-description">Бонусов хватит на полноценный анализ нескольких звонков и проведение тренировок команды.<span class="daily-bonus-renewal">Лимиты обновляются в 00:00 — всего 10 раз за пробный период.</span></p>
<button class="daily-bonus-start">Начать пользоваться</button>
</div>`}</div></div>`;
const measure = document.createElement('div');
measure.innerHTML = card;
document.body.append(measure);
await document.fonts.ready;
const height = Math.ceil(measure.querySelector(isNotice ? '.daily-bonus-notice' : '.daily-bonus-welcome').getBoundingClientRect().height);
const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width * scale}" height="${height * scale}" viewBox="0 0 ${width} ${height}"><foreignObject width="${width}" height="${height}">${card}</foreignObject></svg>`;
const image = new Image();
image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
await image.decode();
const canvas = document.createElement('canvas');
canvas.width = width * scale; canvas.height = height * scale;
canvas.getContext('2d').drawImage(image, 0, 0);
const result = document.createElement('img');
result.alt = 'Бонусная плашка PNG в высоком качестве';
result.src = canvas.toDataURL('image/png');
result.style.cssText = 'display:block;max-width:100%;height:auto';
document.body.replaceChildren(result);
</script>
</body>
</html>
